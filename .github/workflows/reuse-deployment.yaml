name: Deployment - Reusable Workflow
on:
    workflow_call:
        secrets:
            mongodb-password:
                required: true
        inputs:
            mongodb-uri:
                required: true
                type: string
            environment:
                required: true
                type: string
                default: "development"
            k8s-manifest-dir:
                required: true
                type: string
                default: "kubernetes/development"
      
jobs:
    reuse-deploy:
        permissions:
            id-token: write
        runs-on: ubuntu-latest
        outputs:
          app_uri: ${{ steps.app-uri.outputs.APP_URI }} 
        environment:
          name: ${{ inputs.environment }}
          url: https://${{ steps.app-uri.outputs.APP_URI }}
        steps:
            - name: code checkout
              uses: actions/checkout@v4
            
            - name: install kubectl api
              uses: azure/setup-kubectl@v3
            
            - name: configure aws credentials
              uses: aws-actions/configure-aws-credentials@v4
              with:
                role-to-assume: arn:aws:iam::007670671403:role/github-actions-deploy
                aws-region: us-east-1
            
            - name: update kubeconfig
              run: aws eks update-kubeconfig --region us-east-1 --name cluster-1

            - name: check client version
              run: |
                kubectl version
                echo "======"
            
            - name: save ingress-ip as github variable
              run: | 
                ELB_HOSTNAME=$(kubectl -n ingress-nginx get services ingress-nginx-controller -o jsonpath='{.status.loadBalancer.ingress[0].hostname}')
                echo "INGRESS_IP=$(nslookup $ELB_HOSTNAME | awk '/^Address: / { print $2 }' | head -n 1)"  >> $GITHUB_ENV

            - name: replace placeholder
              uses: cschleiden/replace-tokens@v1
              with:
                files: '["${{ inputs.k8s-manifest-dir }}/*"]'
              env:
                NAMESPACE: ${{ vars.NAMESPACE }}
                REPLICAS: ${{ vars.REPLICAS }}
                K8S_IMAGE: ${{ vars.DOCKER_USERNAME }}/solar-system:${{ github.sha }}
                INGRESS_IP: ${{ env.INGRESS_IP}}

            
            - name: check files
              run: |
                cat ${{ inputs.k8s-manifest-dir }}/*.yaml
            
            - name: create secrets
              run: |
                kubectl -n ${{ vars.NAMESPACE }} create secret generic mongo-db-creds \
                --from-literal=MONGO_URI=${{ inputs.mongodb-uri}} \
                --from-literal=MONGO_USERNAME=${{ vars.MONGO_USERNAME }} \
                --from-literal=MONGO_PASSWORD=${{ secrets.mongodb-password }} \
                --save-config \
                --dry-run=client \
                -o yaml | kubectl apply -f -
            
            - name: deploy to Dev
              run: |
                kubectl apply -f ${{ inputs.k8s-manifest-dir }}
            
            - name: set app url 
              id: app-uri
              run: echo "APP_URI=$(kubectl get ingress -n  ${{ vars.NAMESPACE }} -o jsonpath='{.items[0].spec.tls[0].hosts[0]}')" >> $GITHUB_OUTPUT