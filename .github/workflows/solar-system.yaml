name: Workflow Unit Testing
on: 
    push:
        branches:
            - main
            - "feature/*"

env:
    MONGO_URI: ${{ vars.MONGO_URI }}
    MONGO_USERNAME: ${{ vars.MONGO_USERNAME }}
    MONGO_PASSWORD: ${{ secrets.MONGO_PASSWORD }}

jobs:
    unit-testing:
        services:
          mongo-db:
            image: siddharth67/mongo-db:non-prod
            ports:
              - 27017:27017
        env:
            MONGO_URI: "mongodb://localhost:27017/superData"
            MONGO_USERNAME: non-prod-user
            MONGO_PASSWORD: non-prod-password
        strategy:
            fail-fast: true
            matrix:
                os: [ubuntu-latest]
                nodejs_version: [18]
                exclude:
                  - os : macos-latest
                    nodejs_version: 20

        runs-on: ${{ matrix.os }}
        steps:
            - name: code checkout
              uses: actions/checkout@v4
            
            - name: setup node version ${{ matrix.nodejs_version }}
              uses: actions/setup-node@v3
              with:
                node-version: ${{ matrix.nodejs_version }}
            
            - name: cache npm dependencies
              uses: actions/cache@v3
              with:
                path: node_modules 
                key: ${{ runner.os }}-node_modules-${{ hashFiles('package-lock.json') }}

                
            - name: install node dependencies
              run: npm install
            
            - name: unit testing
              id: npm-unit-testing-result
              run: npm test
            
            - name: Dump steps context
              if: always()
              env:
                STEPS_CONTEXT: ${{ toJson(steps) }}
              run: echo "$STEPS_CONTEXT"

            - name: upload test results artifact
              if: failure()
              uses: actions/upload-artifact@v4
              with:
                name: Motcha_test_results_${{ matrix.os }}_${{ matrix.nodejs_version }}
                path: test-results.xml
    
    code-coverage:
        container: 
            image: node:18
        services:
          mongo-db:
            image: siddharth67/mongo-db:non-prod
            options: 
                --name mongo
        env:
            MONGO_URI: "mongodb://mongo:27017/superData"
            MONGO_USERNAME: non-prod-user
            MONGO_PASSWORD: non-prod-password
        strategy:
            fail-fast: true
            matrix:
                os: [ubuntu-latest]
                nodejs_version: [18]
                exclude:
                  - os : macos-latest
                    nodejs_version: 20
        runs-on: ${{ matrix.os }}
        steps:
            - name: code checkout
              uses: actions/checkout@v4
            
            # - name: setup node version ${{ matrix.nodejs_version }}
            #   uses: actions/setup-node@v3
            #   with:
            #     node-version: ${{ matrix.nodejs_version }}
            
            - name: install node dependencies
              run: npm install
            
            - name: code coverage
              run: npm run coverage
              continue-on-error: true
            
            - name: upload test results artifact
              uses: actions/upload-artifact@v4
              with:
                name: code_coverage_results_${{ matrix.os }}_${{ matrix.nodejs_version }}
                path: coverage
    
    docker:
        runs-on: ubuntu-latest
        needs: [unit-testing, code-coverage]
        permissions:
            packages: write
        steps:
            - name: code checkout
              uses: actions/checkout@v4
            
            - name: dockerhub login
              uses: docker/login-action@v2.2.0
              with:
                username: ${{ vars.DOCKER_USERNAME }}
                password: ${{ secrets.DOCKER_PASSWORD }}

            # - name: GHCR login
            #   uses: docker/login-action@v2.2.0
            #   with:
            #     registry: ghcr.io
            #     username: ${{ github.repository_owner }}
            #     password: ${{ secrets.GITHUB_TOKEN }}

            - name: docker build for test
              uses: docker/build-push-action@v4
              with:
                context: .
                push: false
                tags: ${{ vars.DOCKER_USERNAME }}/solar-system:${{ github.sha }}
            
            - name: docker test
              run: |
                docker images
                docker run --name solar-system-app -d \
                -p 3000:3000 \
                -e MONGO_URI=$MONGO_URI \
                -e MONGO_USERNAME=$MONGO_USERNAME \
                -e MONGO_PASSWORD=$MONGO_PASSWORD \
                ${{ vars.DOCKER_USERNAME }}/solar-system:${{ github.sha }}

                export IP=$(docker inspect -f '{{ range .NetworkSettings.Networks }}{{.IPAddress}}{{end}}' solar-system-app)
                echo $IP

                echo Testing docker image
                wget -q -O - 127.0.0.1:3000/live | grep live
            
            - name: docker push
              uses: docker/build-push-action@v4
              with:
                context: .
                push: true
                tags:  |
                    ${{ vars.DOCKER_USERNAME }}/solar-system:${{ github.sha }}
                # ghcr.io/${{ github.repository_owner }}/solar-system:${{ github.sha }}
    
    dev-deploy:
        if: contains(github.ref, 'feature')
        needs: [ docker ]
        uses: ./.github/workflows/reuse-deployment.yaml
        secrets: 
          mongodb-password: ${{ secrets.MONGO_PASSWORD }}
        with:
          mongodb-uri: ${{ vars.MONGO_URI }}
    
    # dev-integration-testing:
    #     if: contains(github.ref, 'feature')
    #     needs: dev-deploy
    #     runs-on: ubuntu-latest
    #     steps:
    #         - name: test app url
    #           run: |
    #             echo ${{ needs.dev-deploy.outputs.app_uri }}
    #             echo "====="
    #             curl https://${{ needs.dev-deploy.outputs.app_uri }}/live -s -k | jq -r .status | grep -i live

    prod-deploy:
        if: github.ref == 'refs/heads/main'
        needs: [ docker ]
        uses: ./.github/workflows/reuse-deployment.yaml   
        secrets: 
          mongodb-password: ${{ secrets.MONGO_PASSWORD }} 
        with:
          mongodb-uri: ${{ vars.MONGO_URI }}

    # prod-integration-testing:
    #     if: github.ref == 'refs/heads/main'
    #     needs: prod-deploy
    #     runs-on: ubuntu-latest
    #     steps:
    #         - name: test app url
    #           run: |
    #             echo ${{ needs.prod-deploy.outputs.app_uri }}
    #             echo "====="
    #             curl https://${{ needs.prod-deploy.outputs.app_uri }}/live -s -k | jq -r .status | grep -i live