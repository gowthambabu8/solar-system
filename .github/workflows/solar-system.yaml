name: Workflow Unit Testing
on: 
    push:
        branches:
            - main
            - "feature/*"

jobs:
    unit-testing:
        runs-on: ubuntu-latest
        steps:
            - name: code checkout
              uses: actions/checkout@v4
            
            - name: setup node version 18
              uses: actions/setup-node@v3
              with:
                node-version: 18
            
            - name: install node dependencies
              run: npm install
            
            - name: unit tetsing
              run: npm test